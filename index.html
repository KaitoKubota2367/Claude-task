<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude task</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1d1c1a; --muted: #6b6862;
    --border: #dedbd4; --accent: #d6336c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1e1e1c; --text: #f0eee9; --muted: #a09d96;
      --border: #34332f; --accent: #f06595; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); line-height: 1.6;
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: .92rem; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.app {
    display: flex; gap: 14px; align-items: center; padding: 14px 16px; text-decoration: none; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  }
  a.app:hover, a.app:focus-visible { border-color: var(--accent); outline: none; }
  a.app img { width: 48px; height: 48px; border-radius: 12px; flex: none; }
  a.app b { display: block; }
  a.app span { color: var(--muted); font-size: .88rem; }
</style>
</head>
<body>
<main>
  <h1>Claude task</h1>
  <p class="sub">アプリ一覧</p>
  <ul>
    <li>
      <a class="app" href="artist-finder/">
        <img src="artist-finder/icon-192.png" alt="">
        <div><b>似てるアーティスト探し</b><span>今聴いている曲・アーティストから、似ているアーティストや雰囲気の近い曲を探します。</span></div>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
