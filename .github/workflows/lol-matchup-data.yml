# LoL 相性ナビ：Riot API から試合データを集めてビルドを集計し、lol-data ブランチに保存する。
# 1回の実行で「集める（約55分）→ 保存」を最大6回くり返す（約5時間半）。
# GitHub は予約実行を間引くことがあるので、1時間ごとに予約しておき、
# 前の実行が続いている間は次の実行が待機する（＝ほぼ途切れずに集め続ける）。
# Actions タブの「Run workflow」から手動でも実行できる。
# APIキーはリポジトリの Secrets（RIOT_API_KEY）に保存しておく。
name: lol-matchup data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: '1回あたりの集める時間（分）'
        default: '55'
      rounds:
        description: 'くり返す回数（1〜6）'
        default: '6'

concurrency:
  group: lol-matchup-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads origin lol-data >/dev/null; then
            git clone --depth 1 --branch lol-data "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          else
            mkdir -p data
          fi

      - name: Collect and publish
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RUN_MINUTES: ${{ github.event.inputs.minutes || '55' }}
          ROUNDS: ${{ github.event.inputs.rounds || '6' }}
          DATA_DIR: data
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {
            ( cd data
              [ -n "$(ls -A | grep -v '^.git$')" ] || exit 0
              rm -rf .git
              git init -q -b lol-data
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A
              git commit -q -m "data update $(date -u +%Y-%m-%dT%H:%MZ)"
              git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" lol-data )
          }
          [ "$ROUNDS" -ge 1 ] && [ "$ROUNDS" -le 6 ] || ROUNDS=6
          for i in $(seq 1 "$ROUNDS"); do
            echo "::group::round $i / $ROUNDS"
            rc=0
            node lol-matchup/tools/collect.mjs || rc=$?
            publish
            echo "::endgroup::"
            # キー切れなどで失敗したら、保存だけしてそこで終了
            [ "$rc" -eq 0 ] || exit "$rc"
          done
