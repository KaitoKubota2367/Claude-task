<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="似てる探し">
<meta name="theme-color" content="#d6336c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Similar Artist Finder</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --surface-2: #efede8; --text: #1d1c1a;
    --muted: #6b6862; --border: #dedbd4; --accent: #d6336c; --accent-soft: #fbe3ec;
    --star: #e8a400; --err: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1e1e1c; --surface-2: #2a2a27; --text: #f0eee9;
      --muted: #a09d96; --border: #34332f; --accent: #f06595; --accent-soft: #3a1f2a;
      --star: #ffc94d; --err: #ff8787;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: .02em; }
  h3 { margin: 0 0 8px; font-size: 1rem; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .92rem; }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 16px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=password] {
    flex: 1 1 220px; min-width: 0; padding: 10px 12px; font-size: 1rem;
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: 10px 16px; font-size: .95rem; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.small { padding: 5px 10px; font-size: .82rem; }
  button:disabled { opacity: .5; cursor: default; }
  details summary { cursor: pointer; font-weight: 600; }
  details .help { color: var(--muted); font-size: .88rem; margin: 8px 0 12px; }
  details .help a { color: var(--accent); }
  label.small { font-size: .85rem; color: var(--muted); display: block; margin: 10px 0 4px; }
  .check { display: flex; gap: 6px; align-items: center; font-size: .9rem; color: var(--muted); }
  #status { min-height: 1.5em; font-size: .9rem; color: var(--muted); margin: 8px 0; }
  #status.err { color: var(--err); }
  #nowplaying { font-size: .9rem; margin-top: 8px; color: var(--muted); }
  #nowplaying b { color: var(--text); }
  .crumbs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 16px; font-size: .85rem; }
  .crumbs button { padding: 3px 10px; font-size: .82rem; border-radius: 999px; }
  .seed { display: flex; gap: 16px; align-items: flex-start; }
  .seed > img, .seed > .ph { width: 96px; height: 96px; border-radius: 12px; flex: none; font-size: 2rem; }
  .seed h2 { margin: 0 0 4px; font-size: 1.3rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .tag {
    font-size: .78rem; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft);
    color: var(--accent); border: none; cursor: pointer;
  }
  .tag:hover { text-decoration: underline; }
  .bio { font-size: .88rem; color: var(--muted); margin: 6px 0 0; }
  .favlist { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 2px; font-size: .85rem;
    border: 1px solid var(--border); border-radius: 999px; background: var(--bg);
  }
  .chip .n { padding: 3px 4px 3px 10px; cursor: pointer; }
  .chip .n:hover { color: var(--accent); }
  .chip .x { border: none; background: none; padding: 3px 8px 3px 4px; color: var(--muted); font-size: .9rem; }
  .chip .x:hover { color: var(--err); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; display: flex; flex-direction: column; position: relative;
  }
  .card .art { aspect-ratio: 1; width: 100%; object-fit: cover; display: block; background: var(--surface-2); cursor: pointer; }
  .ph {
    display: flex; align-items: center; justify-content: center; font-size: 2.4rem; font-weight: 700;
    background: var(--surface-2); color: var(--muted); aspect-ratio: 1; width: 100%; cursor: pointer;
  }
  .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card .name { font-weight: 700; cursor: pointer; overflow-wrap: anywhere; }
  .card .name:hover { color: var(--accent); }
  .star {
    border: none; background: none; padding: 0 2px; font-size: 1.3rem; line-height: 1;
    color: var(--muted); cursor: pointer;
  }
  .star.on { color: var(--star); }
  .card .star {
    position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%;
    background: rgba(0,0,0,.45); color: #fff; padding: 0;
  }
  .card .star.on { color: var(--star); }
  .bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .meta { font-size: .78rem; color: var(--muted); overflow-wrap: anywhere; }
  .links { display: flex; gap: 6px; margin-top: auto; flex-wrap: wrap; }
  .links a {
    font-size: .78rem; padding: 4px 8px; border-radius: 8px; text-decoration: none;
    border: 1px solid var(--border); color: var(--text);
  }
  .links a:hover { border-color: var(--accent); color: var(--accent); }
  [hidden] { display: none !important; }
  .modes { display: flex; gap: 4px; margin-bottom: 10px; background: var(--surface-2); padding: 4px; border-radius: 10px; width: fit-content; }
  .mode { border: none; background: transparent; padding: 6px 16px; border-radius: 8px; font-size: .9rem; color: var(--muted); }
  .mode.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .artist-link {
    background: none; border: none; padding: 0; font-size: .82rem; color: var(--muted);
    text-align: left; cursor: pointer; overflow-wrap: anywhere;
  }
  .artist-link:hover { color: var(--accent); text-decoration: underline; }
  .play {
    font-size: .78rem; padding: 4px 8px; border-radius: 8px; background: var(--accent-soft);
    color: var(--accent); border: 1px solid transparent; font-weight: 600;
  }
  .sync { font-size: .8rem; color: var(--muted); font-weight: normal; margin-left: 6px; }
  .sync.err { color: var(--err); }
  @media (max-width: 480px) {
    main { padding-top: 20px; }
    h1 { font-size: 1.3rem; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .card .body { padding: 8px 10px 10px; }
    .links a { font-size: .72rem; padding: 3px 6px; }
    .seed > img, .seed > .ph { width: 72px; height: 72px; }
    #q, #qTrack { flex-basis: 100%; }
  }
</style>
</head>
<body>
<main>
  <h1>🎧 似てるアーティスト探し</h1>
  <p class="sub">今聴いているアーティストから、似ている人たちを探します。☆ で好きなアーティストを保存すると、その傾向からおすすめを出せます。</p>

  <details class="panel" id="settings">
    <summary>⚙️ 設定</summary>
    <div class="help">
      Last.fm の APIキーは <a href="https://www.last.fm/api/account/create" target="_blank" rel="noopener">こちら</a>で取得できます。ユーザー名を入れると「今聴いている曲」の読み取りと、「よく聴くアーティストを除く」が使えます。
    </div>
    <label class="small" for="apiKey">Last.fm APIキー</label>
    <div class="row"><input type="password" id="apiKey" placeholder="32文字の英数字" autocomplete="off"></div>
    <label class="small" for="lfmUser">Last.fm ユーザー名（任意）</label>
    <div class="row"><input type="text" id="lfmUser" placeholder="例: your_name" autocomplete="off"></div>
    <label class="small" for="ghToken">GitHub トークン（PC・スマホでデータを共有する場合）</label>
    <div class="row"><input type="password" id="ghToken" placeholder="ghp_ で始まる文字列" autocomplete="off"></div>
    <div class="help" style="margin-top:6px">
      <a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=Similar%20Artist%20Finder" target="_blank" rel="noopener">トークン作成ページ</a>で「gist」にだけチェックが入った状態のまま作成し、表示された文字列を貼り付けてください。2台目以降の端末では、ここにトークンを入れて保存するだけで、APIキー・ユーザー名・お気に入りが読み込まれます。
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="saveBtn">保存</button>
      <span id="saveMsg" class="meta"></span>
    </div>
  </details>

  <div class="panel">
    <div class="modes">
      <button class="mode on" id="modeArtist" aria-pressed="true">アーティストを探す</button>
      <button class="mode" id="modeTrack" aria-pressed="false">曲を探す</button>
    </div>
    <div class="row">
      <input type="text" id="q" placeholder="アーティスト名（例: Vaundy, Radiohead）">
      <input type="text" id="qTrack" placeholder="曲名（例: 怪獣の花唄）" hidden>
      <button class="primary" id="searchBtn">探す</button>
      <button id="nowBtn" title="Last.fm から今聴いている曲を読み取ります">▶ 今聴いている曲から</button>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="check"><input type="checkbox" id="autoFollow"> 曲が変わったら自動で更新（15秒ごとに確認）</label>
    </div>
    <div id="nowplaying"></div>
  </div>

  <div class="panel">
    <h3>★ 好きなアーティスト <span class="meta" id="favCount"></span><span class="sync" id="syncStatus"></span></h3>
    <div class="favlist" id="favList"></div>
    <div class="row">
      <button class="primary" id="recBtn">★ 好みからおすすめを探す</button>
      <label class="check"><input type="checkbox" id="excludeKnown"> Last.fm でよく聴いているアーティストを除く</label>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="small" id="exportBtn">書き出し（バックアップ）</button>
      <button class="small" id="importBtn">読み込み</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </div>

  <div id="status"></div>
  <div class="crumbs" id="crumbs"></div>
  <div id="seed"></div>
  <div class="grid" id="results"></div>
</main>

<script>
(() => {
  const LFM = 'https://ws.audioscrobbler.com/2.0/';
  const $ = id => document.getElementById(id);
  // 同じサイト（github.io の同じリポジトリ）に置く他のアプリと保存データが
  // ぶつからないよう、すべてのキーに接頭辞を付ける。旧キーの値は自動で引き継ぐ。
  const PREFIX = 'artistFinder.';
  const store = {
    get(k) {
      try {
        const v = localStorage.getItem(PREFIX + k);
        if (v !== null) return v;
        const old = localStorage.getItem(k);
        if (old !== null) { localStorage.setItem(PREFIX + k, old); localStorage.removeItem(k); return old; }
        return '';
      } catch { return ''; }
    },
    set(k, v) { try { localStorage.setItem(PREFIX + k, v); } catch {} }
  };

  let history = [];          // 辿ってきたアーティスト
  let lastNowArtist = '';    // 自動更新用：最後に検出した再生中アーティスト
  let lastNowTrack = '';     // 自動更新用：最後に検出した再生中の曲（"アーティスト|曲名"）
  let mode = 'artist';       // 'artist' = アーティストを探す / 'track' = 曲を探す
  let pollTimer = null;
  let searchToken = 0;       // 古い検索結果で上書きしないため

  // ---------- お気に入り ----------
  let favs = [];
  try { favs = JSON.parse(store.get('favs') || '[]'); } catch { favs = []; }
  if (!Array.isArray(favs)) favs = [];
  const key = s => s.toLowerCase().trim();
  const isFav = name => favs.some(f => key(f) === key(name));
  function saveFavs(fromRemote = false) {
    store.set('favs', JSON.stringify(favs)); renderFavs(); syncStars();
    if (!fromRemote) schedulePush();
  }
  function toggleFav(name) {
    if (isFav(name)) favs = favs.filter(f => key(f) !== key(name));
    else favs.push(name);
    saveFavs();
  }
  function starButton(name) {
    const b = document.createElement('button');
    b.className = 'star';
    b.dataset.name = name;
    b.onclick = e => { e.stopPropagation(); toggleFav(name); };
    paintStar(b);
    return b;
  }
  function paintStar(b) {
    const on = isFav(b.dataset.name);
    b.classList.toggle('on', on);
    b.textContent = on ? '★' : '☆';
    b.title = on ? 'お気に入りから外す' : 'お気に入りに追加';
    b.setAttribute('aria-pressed', on);
  }
  function syncStars() { document.querySelectorAll('.star').forEach(paintStar); }
  function renderFavs() {
    const list = $('favList');
    list.innerHTML = '';
    $('favCount').textContent = favs.length ? '（' + favs.length + '組）' : '';
    $('recBtn').disabled = favs.length === 0;
    if (!favs.length) {
      list.innerHTML = '<span class="meta">まだありません。検索結果のカードの ☆ を押すと追加できます。</span>';
      return;
    }
    favs.forEach(f => {
      const c = document.createElement('span');
      c.className = 'chip';
      const n = document.createElement('span');
      n.className = 'n'; n.textContent = f; n.title = f + ' に似ているアーティストを探す';
      n.onclick = () => goArtist(f);
      const x = document.createElement('button');
      x.className = 'x'; x.textContent = '×'; x.title = 'お気に入りから外す';
      x.onclick = () => toggleFav(f);
      c.append(n, x);
      list.appendChild(c);
    });
  }

  // ---------- 初期化 ----------
  $('apiKey').value = store.get('lfm_key');
  $('lfmUser').value = store.get('lfm_user');
  $('ghToken').value = store.get('gh_token');
  if (!store.get('lfm_key') && !store.get('gh_token')) $('settings').open = true;
  renderFavs();

  $('saveBtn').onclick = async () => {
    const oldToken = store.get('gh_token');
    const newToken = $('ghToken').value.trim();
    store.set('lfm_key', $('apiKey').value.trim());
    store.set('lfm_user', $('lfmUser').value.trim());
    store.set('gh_token', newToken);
    knownCache = null;
    $('saveMsg').textContent = '保存しました ✓';
    setTimeout(() => $('saveMsg').textContent = '', 2000);
    if (newToken && newToken !== oldToken) {
      store.set('gist_id', '');
      await linkSync();          // 初めてつなぐ：手元とクラウドのデータをまとめる
    } else if (newToken) {
      schedulePush();
    } else {
      setSync('');
    }
    if (store.get('lfm_key')) $('settings').open = false;
  };
  $('searchBtn').onclick = () => {
    const a = $('q').value.trim(), t = $('qTrack').value.trim();
    if (mode === 'track') {
      if (!a || !t) { setStatus('曲を探すには、アーティスト名と曲名の両方を入力してください。', true); return; }
      exploreTrack(a, t);
    } else if (a) explore(a, true);
  };
  ['q', 'qTrack'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) $('searchBtn').click(); }));

  // 「アーティストを探す」「曲を探す」の切り替え（端末ごとに記憶）
  function setMode(m) {
    mode = m;
    try { localStorage.setItem('artistFinder.mode', m); } catch {}
    $('modeArtist').classList.toggle('on', m === 'artist');
    $('modeTrack').classList.toggle('on', m === 'track');
    $('modeArtist').setAttribute('aria-pressed', m === 'artist');
    $('modeTrack').setAttribute('aria-pressed', m === 'track');
    $('qTrack').hidden = m !== 'track';
    $('q').placeholder = m === 'track' ? 'アーティスト名' : 'アーティスト名（例: Vaundy, Radiohead）';
  }
  $('modeArtist').onclick = () => setMode('artist');
  $('modeTrack').onclick = () => setMode('track');
  try { if (localStorage.getItem('artistFinder.mode') === 'track') setMode('track'); } catch {}
  $('nowBtn').onclick = () => checkNowPlaying(true);
  // 再生中の曲の自動追従：15秒ごと＋画面に戻ったときに確認。チェック状態は端末ごとに記憶
  const POLL_MS = 15000;
  function startFollow() {
    clearInterval(pollTimer);
    checkNowPlaying(false);
    pollTimer = setInterval(() => { if (document.visibilityState === 'visible') checkNowPlaying(false); }, POLL_MS);
  }
  $('autoFollow').onchange = e => {
    try { localStorage.setItem('artistFinder.auto_follow', e.target.checked ? '1' : '0'); } catch {}
    if (e.target.checked) startFollow(); else clearInterval(pollTimer);
  };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && $('autoFollow').checked) checkNowPlaying(false);
  });
  let autoFollowSaved = '0';
  try { autoFollowSaved = localStorage.getItem('artistFinder.auto_follow') || '0'; } catch {}
  if (autoFollowSaved === '1' && store.get('lfm_user')) { $('autoFollow').checked = true; startFollow(); }
  $('recBtn').onclick = recommendFromFavs;
  $('excludeKnown').checked = store.get('exclude_known') === '1';
  $('excludeKnown').onchange = e => { store.set('exclude_known', e.target.checked ? '1' : '0'); schedulePush(); };

  // ---------- GitHub Gist で PC・スマホ間を同期 ----------
  // 保存内容: お気に入り / Last.fm APIキー / ユーザー名 / 除外設定
  const GIST_FILE = 'artist-finder-data.json';
  let pushTimer = null, pushing = false, pushPending = false;

  function setSync(msg, isErr = false) {
    $('syncStatus').textContent = msg;
    $('syncStatus').className = 'sync' + (isErr ? ' err' : '');
  }
  const timeNow = () => new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

  async function gh(path, opts = {}) {
    const res = await fetch('https://api.github.com' + path, {
      ...opts,
      cache: 'no-store',
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + store.get('gh_token'),
        ...(opts.body ? { 'Content-Type': 'application/json' } : {})
      }
    });
    if (res.status === 401) throw new Error('GitHub トークンが正しくないか、期限が切れています。「設定」で入れ直してください。');
    if (res.status === 403) throw new Error('GitHub トークンに gist の権限がありません。作り直してください。');
    if (!res.ok) { const e = new Error('GitHub との通信に失敗しました（' + res.status + '）'); e.status = res.status; throw e; }
    return res.json();
  }

  function localState() {
    return {
      app: 'similar-artist-finder', version: 1, updatedAt: new Date().toISOString(),
      favorites: favs,
      lastfmKey: store.get('lfm_key'),
      lastfmUser: store.get('lfm_user'),
      excludeKnown: store.get('exclude_known') === '1'
    };
  }
  function applyState(s, merge) {
    if (!s || typeof s !== 'object') return;
    if (Array.isArray(s.favorites)) {
      const remote = s.favorites.filter(n => typeof n === 'string' && n.trim());
      if (merge) { remote.forEach(n => { if (!isFav(n)) favs.push(n); }); }
      else favs = remote;
      saveFavs(true);
    }
    // 空の値でこの端末の設定を消さない
    if (s.lastfmKey) { store.set('lfm_key', s.lastfmKey); $('apiKey').value = s.lastfmKey; }
    if (s.lastfmUser) { store.set('lfm_user', s.lastfmUser); $('lfmUser').value = s.lastfmUser; }
    if (typeof s.excludeKnown === 'boolean') {
      store.set('exclude_known', s.excludeKnown ? '1' : '0'); $('excludeKnown').checked = s.excludeKnown;
    }
    knownCache = null;
  }

  // 同期用 Gist を探す（なければ作る）。戻り値: { id, data|null, created }
  async function findGist() {
    let id = store.get('gist_id');
    if (id) {
      try { return { id, data: await readGist(id), created: false }; }
      catch (e) { if (e.status !== 404) throw e; store.set('gist_id', ''); }
    }
    for (let page = 1; page <= 10; page++) {
      const list = await gh('/gists?per_page=100&page=' + page);
      const g = list.find(g => g.files && g.files[GIST_FILE]);
      if (g) { store.set('gist_id', g.id); return { id: g.id, data: await readGist(g.id), created: false }; }
      if (list.length < 100) break;
    }
    const g = await gh('/gists', {
      method: 'POST',
      body: JSON.stringify({
        description: 'Similar Artist Finder の同期データ（削除しないでください）',
        public: false,
        files: { [GIST_FILE]: { content: JSON.stringify(localState(), null, 2) } }
      })
    });
    store.set('gist_id', g.id);
    return { id: g.id, data: null, created: true };
  }
  async function readGist(id) {
    const g = await gh('/gists/' + id);
    const f = g.files && g.files[GIST_FILE];

  async function lastfm(params) {
    const url = LFM + '?' + new URLSearchParams({ ...params, api_key: apiKey(), format: 'json' });

  // 同時実行数を制限して順番に処理する
  async function mapLimited(items, limit, fn) {
    const out = new Array(items.length);
    let i = 0;
    const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
      while (i < items.length) { const idx = i++; out[idx] = await fn(items[idx], idx); }
    });
    await Promise.all(workers);
    return out;
  }

  // Last.fm の結果キャッシュ（同じ問い合わせを繰り返さない）

  // iTunes Search API は CORS 非対応のため JSONP で呼ぶ
  function jsonp(url, timeout = 8000) {
    return new Promise((resolve, reject) => {
      const cb = '__itunes_' + Math.random().toString(36).slice(2);
      const s = document.createElement('script');
      const done = () => { delete window[cb]; s.remove(); clearTimeout(t); };
      const t = setTimeout(() => { done(); reject(new Error('timeout')); }, timeout);
      window[cb] = d => { done(); resolve(d); };
      s.onerror = () => { done(); reject(new Error('load error')); };
      s.src = url + '&callback=' + cb;
      document.head.appendChild(s);
    });
  }

  // iTunes の呼び出しは同時3件まで（レート制限対策）＋キャッシュ
  const artCache = new Map();
  const queue = []; let running = 0;
  const norm = s => (s || '').toLowerCase().replace(/\s+/g, '');
  function itunesQueue(cacheKey, params, pick) {
    if (artCache.has(cacheKey)) return artCache.get(cacheKey);
    const p = new Promise(resolve => { queue.push({ cacheKey, params, pick, resolve }); pump(); });
    artCache.set(cacheKey, p);
    return p;
  }
  function pump() {
    while (running < 3 && queue.length) {
      const { cacheKey, params, pick, resolve } = queue.shift();
      running++;
      const url = 'https://itunes.apple.com/search?' + new URLSearchParams({ ...params, country: 'JP' });
      jsonp(url).then(d => resolve(pick((d && d.results) || [])))
        .catch(() => { artCache.delete(cacheKey); resolve(null); })
        .finally(() => { running--; pump(); });
    }
  }
  const bigArt = u => (u || '').replace('100x100bb', '400x400bb');
  function itunesLookup(name) {
    return itunesQueue('a|' + name, { term: name, entity: 'album', attribute: 'artistTerm', limit: '5' }, list => {
      const hit = list.find(r => norm(r.artistName) === norm(name)) || list[0];
      return hit ? { art: bigArt(hit.artworkUrl100), appleUrl: hit.artistViewUrl || hit.collectionViewUrl || '' } : null;
    });
  }
  // 曲のジャケット・Apple Music リンク・30秒試聴（アーティスト名が一致するものだけ採用）
  function itunesSong(artist, track) {
    return itunesQueue('s|' + artist + '|' + track, { term: artist + ' ' + track, entity: 'song', limit: '15' }, list => {
      const same = list.filter(r => norm(r.artistName) === norm(artist));
      const hit = same.find(r => norm(r.trackName) === norm(track)) ||
                  same.find(r => norm(r.trackName).startsWith(norm(track)) || norm(track).startsWith(norm(r.trackName)));
      return hit ? { art: bigArt(hit.artworkUrl100), appleUrl: hit.trackViewUrl || '', preview: hit.previewUrl || '' } : null;
    });
  }

  // ---------- 1組のアーティストから探す ----------

  // ---------- 好きなアーティスト全体の傾向からおすすめ ----------
  async function recommendFromFavs() {
    if (!favs.length) return;
    const token = ++searchToken;
    history = []; renderCrumbs();
    $('results').innerHTML = ''; $('seed').innerHTML = '';
    try {
      let known = null;
      if ($('excludeKnown').checked) known = await getKnownArtists();

      let done = 0;
      setStatus('好きなアーティスト ' + favs.length + '組の傾向を分析しています… (0/' + favs.length + ')');
      const results = await mapLimited(favs, 3, async fav => {
        const [sim, tags] = await Promise.all([
          getSimilar(fav, 60).catch(() => null),
          getTopTags(fav).catch(() => [])
        ]);
        done++;
        if (token === searchToken) setStatus('好きなアーティスト ' + favs.length + '組の傾向を分析しています… (' + done + '/' + favs.length + ')');
        return { fav, sim, tags };
      });
      if (token !== searchToken) return;

      // 候補ごとに「何組のお気に入りと似ているか」と類似度の合計を集計
      const favKeys = new Set(favs.map(key));
      const cand = new Map();
      for (const { fav, sim } of results) {
        if (!sim) continue;
        for (const a of asArray(sim.artist)) {
          const k = key(a.name);
          if (favKeys.has(k) || (known && known.has(k))) continue;
          const c = cand.get(k) || { name: a.name, score: 0, from: [] };
          c.score += Number(a.match) || 0;
          c.from.push({ fav, match: Number(a.match) || 0 });
          cand.set(k, c);
        }
      }

      // 傾向タグ：お気に入り全体で重みを合算（"seen live" など好みと関係ないタグは除外）
      const ignore = new Set(['seen live', 'favorites', 'favourite', 'favorite', 'my favorite', 'awesome', 'love', 'beautiful', 'male vocalists', 'female vocalists']);
      const tagScore = new Map();
      for (const { tags } of results) {
        tags.slice(0, 10).forEach(t => {
          const k = key(t.name);
          if (ignore.has(k) || !k) return;
          const cur = tagScore.get(k) || { name: t.name, score: 0 };
          cur.score += Number(t.count) || 0;
          tagScore.set(k, cur);
        });
      }
      const topTags = [...tagScore.values()].sort((a, b) => b.score - a.score).slice(0, 10);
      renderTaste(topTags);

      const ranked = [...cand.values()]
        .sort((a, b) => b.from.length - a.from.length || b.score - a.score)
        .slice(0, 36);
      if (!ranked.length) { setStatus('おすすめが見つかりませんでした。好きなアーティストを増やしてみてください。', true); return; }
      const maxScore = Math.max(...ranked.map(r => r.score));
      setStatus('好きなアーティストの傾向から ' + ranked.length + '組をおすすめします。複数のお気に入りに共通して似ている順です。' +
        (known ? '（Last.fm でよく聴くアーティストは除外済み）' : ''));
      ranked.forEach(r => {
        const pct = Math.round(r.score / maxScore * 100);
        const from = r.from.sort((a, b) => b.match - a.match).map(f => f.fav);
        const label = '似ている: ' + from.slice(0, 3).join('、') + (from.length > 3 ? ' ほか' + (from.length - 3) + '組' : '');
        $('results').appendChild(card(r.name, { pct, label, badge: from.length >= 2 ? from.length + '組と共通' : '' }));
      });
    } catch (e) {
      if (token === searchToken) setStatus(e.message, true);
    }
  }

  // ---------- 曲：雰囲気が近い曲を探す ----------

  // ジャンル・国・年代などの大まかなタグ（多くの曲に付くので、雰囲気の比較では軽く扱う）
  const GENERIC_TAGS = new Set(['rock', 'pop', 'j-pop', 'jpop', 'j pop', 'j-rock', 'jrock', 'japanese', 'japan', 'japanese rock',

  const DECADE_RE = /^(\d0s|\d{4}s?|'\d0s)$/;
  function tagFactor(k) {
    if (MOOD_TAGS.has(k)) return 2;

  // タグ一覧 → { タグ: {name, w(重み)} }
  function tagVector(tags, artistName) {
    const v = new Map();
    (tags || []).slice(0, 20).forEach(t => {
      const k = key(t.name || '');
      if (!k || TAG_IGNORE.has(k) || k === key(artistName || '')) return;
      v.set(k, { name: t.name, w: Math.max(Number(t.count) || 0, 1) * tagFactor(k) });

  function cosine(a, b) {

    a.forEach(x => { na += x.w * x.w; });
    b.forEach(x => { nb += x.w * x.w; });
    a.forEach((x, k) => { const y = b.get(k); if (y) dot += x.w * y.w; });
    return na && nb ? dot / Math.sqrt(na * nb) : 0;
  }
  // 曲のタグが少ないときはアーティストのタグで代用
  async function moodOf(artist, track) {
    let vec = tagVector(await getTrackTags(artist, track).catch(() => []), artist);
    if (vec.size >= 2) return { vec, fromArtist: false };
    vec = tagVector(await getTopTags(artist).catch(() => []), artist);
    return { vec, fromArtist: true };
  }

  async function exploreTrack(artist, track) {
    const token = ++searchToken;
    history = []; renderCrumbs();
    $('results').innerHTML = ''; $('seed').innerHTML = '';
    setStatus('「' + track + ' / ' + artist + '」に雰囲気が近い曲を探しています…');
    try {
      const simRes = await lastfm({ method: 'track.getsimilar', artist, track, autocorrect: '1', limit: '60' })
        .catch(e => { if (e.code === 6) return null; throw e; });
      if (token !== searchToken) return;
      const sim = simRes && simRes.similartracks;
      const seedArtist = (sim && sim['@attr'] && sim['@attr'].artist) || artist;
      const seed = await moodOf(seedArtist, track);
      if (token !== searchToken) return;
      renderTrackSeed(seedArtist, track, seed);

      // 候補を集める：
      //  ① よく一緒に聴かれている曲（track.getsimilar）
      //  ② 似ているアーティスト10組の代表曲（その曲の「周辺」の音楽に絞るため）
      setStatus('候補の曲を集めています…');
      const pool = new Map();
      const addCand = (name, a, match) => {
        if (!name || !a) return;
        const k = key(a) + '|' + key(name);
        const c = pool.get(k);
        if (c) c.match = Math.max(c.match, match);
        else pool.set(k, { name, artist: a, match });
      };
      asArray(sim && sim.track).slice(0, 40).forEach(t => addCand(t.name, (t.artist && t.artist.name) || '', Number(t.match) || 0));
      const simArtists = await getSimilar(seedArtist, 10).then(s => asArray(s.artist)).catch(() => []);
      if (token !== searchToken) return;
      const tops = await mapLimited(simArtists, 4, a =>
        lastfm({ method: 'artist.gettoptracks', artist: a.name, autocorrect: '1', limit: '5' })
          .then(d => ({ a, list: asArray(d.toptracks && d.toptracks.track) })).catch(() => ({ a, list: [] })));
      if (token !== searchToken) return;
      // 代表曲は「よく一緒に聴かれている曲」より確度が低いので、アーティストの類似度×0.6 を基準値にする
      tops.forEach(({ a, list }) => list.forEach(t => addCand(t.name, a.name, (Number(a.match) || 0) * 0.6)));
      let cands = [...pool.values()];
      let source = 'similar';
      if (!cands.length) {
        source = 'tags';
        const top = [...seed.vec.values()].sort((a, b) => b.w - a.w).slice(0, 3);
        if (!top.length) {
          setStatus('この曲は Last.fm のデータが少なく、おすすめを作れませんでした。「アーティストを探す」も試してみてください。', true);
          return;
        }
        setStatus('よく一緒に聴かれている曲のデータがないため、雰囲気タグ（' + top.map(t => t.name).join('、') + '）から探しています…');
        const lists = await Promise.all(top.map(t =>
          lastfm({ method: 'tag.gettoptracks', tag: t.name, limit: '40' })
            .then(d => asArray(d.tracks && d.tracks.track)).catch(() => [])));
        if (token !== searchToken) return;
        const m = new Map();
        lists.forEach(list => list.forEach(t => {
          const a = (t.artist && t.artist.name) || '';
          const k = key(a) + '|' + key(t.name);
          const c = m.get(k) || { name: t.name, artist: a, match: 0 };
          c.match += 1 / top.length;
          m.set(k, c);
        }));
        cands = [...m.values()];
      }

      // 元の曲を除き、元のアーティストは1曲・他は2曲まで、上位32曲に絞る
      const seedKey = key(seedArtist) + '|' + key(track);
      const perArtist = new Map();
      cands = cands
        .filter(c => c.artist && key(c.artist) + '|' + key(c.name) !== seedKey)
        .sort((a, b) => b.match - a.match)
        .filter(c => {
          const k = key(c.artist);
          const n = (perArtist.get(k) || 0) + 1;
          perArtist.set(k, n);
          return n <= (k === key(seedArtist) ? 1 : 2);
        })
        .slice(0, 32);
      if (!cands.length) { setStatus('おすすめの曲が見つかりませんでした。', true); return; }

      // 各候補の雰囲気タグを取得して、元の曲との近さを計算
      let done = 0;
      const prog = () => setStatus('候補 ' + cands.length + '曲の雰囲気を比べています… (' + done + '/' + cands.length + ')');
      prog();
      await mapLimited(cands, 4, async c => {
        const m = await moodOf(c.artist, c.name);
        c.vec = m.vec;
        c.mood = cosine(seed.vec, m.vec);
        done++;
        if (token === searchToken) prog();
      });
      if (token !== searchToken) return;

      // 雰囲気の近さを重視（75%）。ジャンル以外のタグが1つも一致しない曲は下げる
      cands.forEach(c => {
        const specificShared = [...c.vec.keys()].some(k => seed.vec.has(k) && !isGeneric(k));
        c.score = 0.25 * c.match + 0.75 * c.mood;
        if (!specificShared) c.score *= 0.5;
      });
      cands.sort((a, b) => b.score - a.score);
      const max = Math.max(...cands.map(c => c.score)) || 1;
      setStatus(cands.length + '曲見つかりました。' +
        (source === 'similar' ? '周辺のアーティストの曲の中から、雰囲気タグが近い順に並べています。' : '雰囲気タグが近い順です。') +
        '曲名を押すと、その曲からさらに探せます。');
      cands.forEach(c => {
        const shared = [...c.vec.entries()]
          .filter(([k]) => seed.vec.has(k))
          .sort((a, b) => Math.min(b[1].w, seed.vec.get(b[0]).w) - Math.min(a[1].w, seed.vec.get(a[0]).w))
          .slice(0, 3).map(([, v]) => v.name);
        $('results').appendChild(trackCard(c, {
          pct: Math.round(c.score / max * 100),
          label: '雰囲気の近さ ' + Math.round(c.mood * 100) + '%' + (shared.length ? '（' + shared.join('・') + '）' : '')
        }));
      });
    } catch (e) {
      if (token === searchToken) setStatus(e.message, true);
    }
  }

  // タグ（雰囲気）の人気曲
  async function exploreTagTracks(tag) {
    const token = ++searchToken;
    history = []; renderCrumbs();
    $('results').innerHTML = '';
    setStatus('タグ「' + tag + '」の人気曲を探しています…');
    try {
      const d = await lastfm({ method: 'tag.gettoptracks', tag, limit: '40' });
      if (token !== searchToken) return;
      const list = asArray(d.tracks && d.tracks.track);
      $('seed').innerHTML = '';
      const p = document.createElement('div');
      p.className = 'panel';
      p.innerHTML = '<h3>🏷️ タグ「' + esc(tag) + '」の人気曲</h3>';
      $('seed').appendChild(p);
      setStatus(list.length + '曲見つかりました。');
      list.forEach((t, i) => $('results').appendChild(trackCard(
        { name: t.name, artist: (t.artist && t.artist.name) || '' },
        { label: '「' + tag + '」人気 ' + (i + 1) + '位' })));
    } catch (e) {
      if (token === searchToken) setStatus(e.message, true);
    }
  }

  function goArtist(name) {
    setMode('artist');
    $('q').value = name;
    explore(name, true);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function goTrack(artist, track) {
    setMode('track');
    $('q').value = artist;
    $('qTrack').value = track;
    exploreTrack(artist, track);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderTrackSeed(artist, track, seed) {
    const wrap = $('seed');
    wrap.innerHTML = '';
    const p = document.createElement('div');
    p.className = 'panel seed';
    const imgSlot = placeholder(track);
    p.appendChild(imgSlot);
    const body = document.createElement('div');
    body.style.minWidth = '0';
    const tags = [...seed.vec.values()].sort((a, b) => b.w - a.w).slice(0, 8);
    body.innerHTML =
      '<h2>' + esc(track) + '</h2>' +
      '<button class="artist-link">' + esc(artist) + '</button>' +
      (tags.length
        ? '<div class="meta" style="margin-top:6px">この曲の雰囲気タグ' + (seed.fromArtist ? '（曲のタグが少ないため、アーティストのタグで代用）' : '') + '：</div>' +
          '<div class="tags">' + tagButtons(tags) + '</div>'
        : '<div class="meta">雰囲気タグが見つかりませんでした。</div>') +
      '<div class="links" style="margin-top:6px"></div>';
    body.querySelector('.artist-link').onclick = () => goArtist(artist);
    body.querySelectorAll('.tag').forEach(b => b.onclick = () => exploreTagTracks(b.dataset.tag));
    const links = body.querySelector('.links');
    links.insertAdjacentHTML('beforeend',
      '<a class="apple" href="' + appleSearchUrl(artist + ' ' + track) + '" target="_blank" rel="noopener">♪ Apple Music</a>' +
      '<a href="' + ytmUrl(artist + ' ' + track) + '" target="_blank" rel="noopener">▶ YouTube Music</a>');
    p.appendChild(body);
    wrap.appendChild(p);
    itunesSong(artist, track).then(r => {
      if (!r) return;
      if (r.art) { const img = new Image(); img.src = r.art; img.alt = track; imgSlot.replaceWith(img); }
      if (r.appleUrl) links.querySelector('.apple').href = r.appleUrl;
      if (r.preview) links.prepend(previewButton(r.preview));
    });
  }

  // c: { name: 曲名, artist }, opts: { pct, label }
  function trackCard(c, opts = {}) {
    const el = document.createElement('div');
    el.className = 'card';
    const go = () => goTrack(c.artist, c.name);
    const artSlot = placeholder(c.name);
    artSlot.onclick = go;
    el.appendChild(artSlot);

    const body = document.createElement('div');
    body.className = 'body';
    const q = c.artist + ' ' + c.name;
    body.innerHTML =
      '<div class="name">' + esc(c.name) + '</div>' +
      '<button class="artist-link" title="このアーティストに似ている人を探す">' + esc(c.artist) + '</button>' +
      (opts.pct != null ? '<div class="bar"><span style="width:' + opts.pct + '%"></span></div>' : '') +
      (opts.label ? '<div class="meta">' + esc(opts.label) + '</div>' : '') +
      '<div class="links">' +
        '<a class="apple" href="' + appleSearchUrl(q) + '" target="_blank" rel="noopener">♪ Apple Music</a>' +
        '<a href="' + ytmUrl(q) + '" target="_blank" rel="noopener">▶ YouTube Music</a>' +
      '</div>';
    body.querySelector('.name').onclick = go;
    body.querySelector('.artist-link').onclick = () => goArtist(c.artist);
    el.appendChild(body);

    itunesSong(c.artist, c.name).then(r => {
      if (!r) return;
      if (r.art) {
        const img = new Image();
        img.className = 'art'; img.loading = 'lazy'; img.alt = c.name; img.src = r.art;
        img.onclick = go;
        artSlot.replaceWith(img);
      }
      const links = body.querySelector('.links');
      if (r.appleUrl) links.querySelector('.apple').href = r.appleUrl;
      if (r.preview) links.prepend(previewButton(r.preview));
    });
    return el;
  }

  function tagButtons(tags) {
    return tags.map(t => '<button class="tag" data-tag="' + esc(t.name) + '">' + esc(t.name) + '</button>').join('');
  }
  function wireTags(root) {
    root.querySelectorAll('.tag').forEach(b => b.onclick = () => exploreTag(b.dataset.tag));
  }

  function renderTaste(topTags) {
    const wrap = $('seed');
    wrap.innerHTML = '';
    const p = document.createElement('div');
    p.className = 'panel';
    p.innerHTML = '<h3>🎯 あなたの傾向</h3>' +
      (topTags.length
        ? '<div class="meta">好きなアーティストによく付いているジャンルタグです。タグを押すと、そのジャンルの人気アーティストを表示します。</div><div class="tags">' + tagButtons(topTags) + '</div>'
        : '<div class="meta">傾向タグを取得できませんでした。</div>');
    wireTags(p);
    wrap.appendChild(p);
  }

  function renderCrumbs() {
    const c = $('crumbs');
    c.innerHTML = '';
    if (history.length < 2) return;
    history.forEach((h, idx) => {
      if (idx) c.appendChild(Object.assign(document.createElement('span'), { textContent: '›', className: 'meta' }));
      const b = document.createElement('button');
      b.textContent = h;
      b.disabled = idx === history.length - 1;
      b.onclick = () => explore(h, false);
      c.appendChild(b);
    });
  }

  function renderSeed(name, info) {
    const wrap = $('seed');
    wrap.innerHTML = '';
    const p = document.createElement('div');
    p.className = 'panel seed';
    const imgSlot = placeholder(name);
    p.appendChild(imgSlot);
    const body = document.createElement('div');
    const tags = info && info.tags ? asArray(info.tags.tag).slice(0, 6) : [];
    const listeners = info && info.stats ? Number(info.stats.listeners).toLocaleString() : '';
    let bio = info && info.bio && info.bio.summary ? info.bio.summary.replace(/<a [^>]*>.*?<\/a>\.?/g, '').trim() : '';
    if (bio.length > 220) bio = bio.slice(0, 220) + '…';
    body.innerHTML =
      '<h2>' + esc(name) + '</h2>' +
      (listeners ? '<div class="meta">Last.fm リスナー ' + listeners + ' 人</div>' : '') +
      (tags.length ? '<div class="tags">' + tagButtons(tags) + '</div>' : '') +
      (bio ? '<p class="bio">' + esc(bio) + '</p>' : '');
    body.querySelector('h2').appendChild(starButton(name));
    wireTags(body);
    p.appendChild(body);
    wrap.appendChild(p);
    itunesLookup(name).then(r => {
      if (r && r.art) {
        const img = new Image(); img.src = r.art; img.alt = name;
        imgSlot.replaceWith(img);
      }
    });
  }

  // opts: { pct: バーの長さ(0-100, 省略可), label: 説明文, badge: 強調表示 }
  function card(name, opts = {}) {
    const el = document.createElement('div');
    el.className = 'card';
    const go = () => { setMode('artist'); $('q').value = name; explore(name, false); window.scrollTo({ top: 0, behavior: 'smooth' }); };

    const artSlot = placeholder(name);
    artSlot.onclick = go;
    el.appendChild(artSlot);
    el.appendChild(starButton(name));

    const body = document.createElement('div');
    body.className = 'body';
    body.innerHTML =
      '<div class="name">' + esc(name) + '</div>' +
      (opts.pct != null ? '<div class="bar"><span style="width:' + opts.pct + '%"></span></div>' : '') +
      (opts.badge ? '<div><span class="tag" style="cursor:default">' + esc(opts.badge) + '</span></div>' : '') +
      (opts.label ? '<div class="meta">' + esc(opts.label) + '</div>' : '') +
      '<div class="links">' +
        '<a class="apple" href="' + appleSearchUrl(name) + '" target="_blank" rel="noopener">♪ Apple Music</a>' +
        '<a href="' + ytmUrl(name) + '" target="_blank" rel="noopener">▶ YouTube Music</a>' +
      '</div>';
    body.querySelector('.name').onclick = go;
    el.appendChild(body);

    itunesLookup(name).then(r => {
      if (!r) return;
      if (r.art) {
        const img = new Image();
        img.className = 'art'; img.loading = 'lazy'; img.alt = name; img.src = r.art;
        img.onclick = go;
        artSlot.replaceWith(img);
      }
      if (r.appleUrl) body.querySelector('.apple').href = r.appleUrl;
    });
    return el;
  }
})();
</script>
</body>
